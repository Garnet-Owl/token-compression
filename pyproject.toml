[project]
name = "token-compression"
version = "0.1.0"
description = "Prompt compression experiment: dictionary and LZ77 compression for LLM prompts, with a LoRA-tuned decompressor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.12.0",
    "datasets>=4.4.2",
    "fastapi>=0.125.0",
    "hf-xet>=1.2.0",
    "peft>=0.18.0",
    "pydantic>=2.12.5",
    "torch>=2.9.1",
    "tiktoken>=0.9.0",
    "transformers>=4.57.3",
    "trl>=0.26.2",
    "uvicorn>=0.38.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=8.0",
    "ruff>=0.14.10",
]
